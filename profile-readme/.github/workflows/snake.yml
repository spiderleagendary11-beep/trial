# Generates the contribution snake SVGs and pushes them to the "output" branch.
# Copy this file to .github/workflows/snake.yml in your <username>/<username> repo.
name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Blue contribution squares + cyan snake to match the README theme
          outputs: |
            dist/github-snake.svg?color_snake=#0969da&color_dots=#ebedf0,#b6e3ff,#54aeff,#0969da,#0a3069
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00d9ff&color_dots=#161b22,#0a3069,#0969da,#1f9fff,#00d9ff

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
